<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    h2{

        color: blue;
        text-align: end;
    }

    p{
        background-color: azure;
    }
    
    </style>
</head>
<body>
    <!-- Internal - inside the html using style as tag under the head section -->
    <!-- if both inline and internal css are used together, then also the inline css will have the higher priority as it is closer to the tag ( check )-->

    <h2>Hello internal css</h2>
    <h2>good evening</h2>
    <p>This is a paragraph tag</p>
</body>
</html>
